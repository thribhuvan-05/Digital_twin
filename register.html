<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#eef4f1"/>
  <title>Create account | Roadwise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"/>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="/runtime-config.js"></script>
  <style>
    :root{--ink:#10241c;--muted:#718078;--green:#16704d;--line:#dde7e2}
    *{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;color:var(--ink);font:14px "DM Sans",sans-serif;background:#eef4f1}
    .auth{display:grid;grid-template-columns:minmax(0,1fr) 430px;height:100dvh;padding:12px;gap:12px}
    #map{position:relative;overflow:hidden;border-radius:22px;filter:saturate(.78)}#map:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(16,36,28,.12),rgba(16,36,28,.56))}
    .showcase{position:absolute;z-index:2;left:48px;bottom:44px;color:#fff}.showcase .logo{display:flex;align-items:center;gap:10px;font:800 16px "Manrope",sans-serif}.logo-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#10241c;color:#b9e769}.showcase h1{max-width:520px;margin:24px 0 10px;font:800 46px/1.05 "Manrope",sans-serif;letter-spacing:-.045em}.showcase p{max-width:430px;margin:0;color:rgba(255,255,255,.82);font-size:15px;line-height:1.55}
    .panel{display:flex;flex-direction:column;justify-content:center;border:1px solid rgba(221,231,226,.9);border-radius:22px;padding:52px;background:rgba(250,252,251,.96);box-shadow:0 18px 50px rgba(18,55,40,.12)}
    .eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.panel h2{margin:8px 0 8px;font:800 34px "Manrope",sans-serif;letter-spacing:-.04em}.subcopy{margin:0 0 24px;color:var(--muted);line-height:1.5}
    label{display:block;margin:0 0 7px;font-size:12px;font-weight:700}input{width:100%;height:46px;margin:0 0 14px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:14px}input:focus{outline:3px solid rgba(22,112,77,.14);border-color:var(--green)}
    button{width:100%;height:48px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:800;box-shadow:0 10px 24px rgba(22,112,77,.18)}button:hover{background:#125d41}
    .feedback{min-height:20px;margin:10px 0 0!important;color:#b45e43!important;font-size:12px!important}.panel p{color:var(--muted);font-size:12px}.panel a{color:var(--green);font-weight:800;text-decoration:none}
    @media(max-width:760px){.auth{display:block;padding:0}.auth>#map{position:absolute;inset:0;border-radius:0}.showcase{display:none}.panel{position:absolute;z-index:2;left:14px;right:14px;top:50%;transform:translateY(-50%);border-radius:18px;padding:24px;background:rgba(250,252,251,.96)}}
  </style>
</head>
<body>
  <main class="auth">
    <section id="map" aria-label="Map preview">
      <div class="showcase"><div class="logo"><span class="logo-mark">R</span><span>ROADWISE</span></div><h1>Plan with better context.</h1><p>Use accident patterns and route data from one focused workspace.</p></div>
    </section>
    <section class="panel">
      <div class="eyebrow">Your field desk</div>
      <h2>Create account</h2>
      <p class="subcopy">Set up a local account to access your workspace.</p>
      <form id="register-form">
        <label for="u">Username</label><input id="u" name="username" autocomplete="username" placeholder="Choose a username" required/>
        <label for="p">Password</label><input id="p" name="new-password" type="password" autocomplete="new-password" placeholder="At least 12 characters" minlength="12" maxlength="128" required/>
        <label for="cp">Confirm password</label><input id="cp" name="confirm-password" type="password" autocomplete="new-password" placeholder="Enter it again" minlength="12" maxlength="128" required/>
        <button type="submit">Create account</button>
      </form>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <p>Already have an account? <a href="/login.html">Sign in</a></p>
    </section>
  </main>
  <script>
    mapboxgl.accessToken=window.ROADWISE_CONFIG.mapboxAccessToken;
    new mapboxgl.Map({container:"map",style:"mapbox://styles/mapbox/satellite-streets-v12",center:[80.2707,13.0827],zoom:11.5});
    document.getElementById("register-form").addEventListener("submit",async event=>{
      event.preventDefault();
      const username=document.getElementById("u").value.trim(),password=document.getElementById("p").value,confirmPassword=document.getElementById("cp").value,feedback=document.getElementById("feedback");
      if(!username||!password||!confirmPassword){feedback.textContent="Complete all fields to continue.";return}
      if(password!==confirmPassword){feedback.textContent="The passwords do not match.";return}
      if(password.length<12||password.length>128){feedback.textContent="Use a password between 12 and 128 characters.";return}
      feedback.textContent="Creating your account…";
      try{
        const response=await fetch("/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
        const data=await response.json();
        if(response.ok&&data.success){window.location.assign("/login.html")}else{feedback.textContent=data.message||"Unable to create account."}
      }catch{feedback.textContent="Unable to reach the server. Check that it is running and try again."}
    });
  </script>
</body>
</html>
